<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:site_name" content="George Anagnostou" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=emoji" />

    <!-- Font: Vollkorn (serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="{{ bodyClass }}">
    <a href="#main-content" class="skip-nav">Skip to content</a>
    {{ header }}
    <main id="main-content">{{ content }}</main>
    {{ footer }}
    <script type="module" src="/static/js/analytics.js"></script>
    {{ liveReload }}
  </body>
</html>
